AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  CampusFix AI - AI-Powered Smart Campus Issue Management System
  Built for AWS ShipIt Challenge, Techfest IIT Bombay in collaboration with AWS.

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.11
    Environment:
      Variables:
        AWS_REGION: ap-south-1
        USE_AWS_STORAGE: "true"
        AWS_S3_BUCKET: !Ref CampusFixEvidenceBucket
        AWS_DYNAMODB_TABLE: !Ref CampusFixComplaintsTable
        JWT_SECRET: "{{resolve:secretsmanager:CampusFixJwtSecret:SecretString}}"
        GEMINI_API_KEY: "{{resolve:secretsmanager:CampusFixGeminiKey:SecretString}}"

Resources:
  # 1. API Gateway + FastAPI Lambda
  CampusFixApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: aws.lambda_handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CampusFixComplaintsTable
        - S3CrudPolicy:
            BucketName: !Ref CampusFixEvidenceBucket
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY

  # 2. DynamoDB Table for complaints and users
  CampusFixComplaintsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CampusFixComplaints
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: Category
          AttributeType: S
        - AttributeName: Status
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: CategoryIndex
          KeySchema:
            - AttributeName: Category
              KeyType: HASH
            - AttributeName: SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: StatusIndex
          KeySchema:
            - AttributeName: Status
              KeyType: HASH
            - AttributeName: SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # 3. S3 Bucket for complaint photo evidence
  CampusFixEvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "campusfix-evidence-${AWS::AccountId}"
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST, HEAD]
            AllowedOrigins: ['*']
            MaxAge: 3600

Outputs:
  CampusFixApiUrl:
    Description: "API Gateway Endpoint URL for CampusFix AI"
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
